pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    log_format sanitized '$remote_addr $request_method $uri $status';
    access_log /dev/stdout sanitized;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name 127.0.0.1 localhost;
        if ($host !~ ^(127\.0\.0\.1|localhost)$) { return 421; }
        ssl_certificate /run/tls/server.pem;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 22m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        location / {
            proxy_pass http://127.0.0.1:8088;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_read_timeout 10s;
        }
    }
}
