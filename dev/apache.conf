ServerName 127.0.0.1
<VirtualHost *:8088>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    Alias /__dev /opt/zinema/dev/http
    <Directory /opt/zinema/dev/http>
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/uploads>
        AllowOverride None
        Options -Indexes -ExecCGI
        RemoveHandler .php .phtml .phar
        <FilesMatch ".*">
            SetHandler none
        </FilesMatch>
        <FilesMatch "^(?![a-f0-9]{32}\.(png|jpg|webp|mp4|webm)$).*">
            Require all denied
        </FilesMatch>
        Header always set X-Content-Type-Options nosniff
    </Directory>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    ErrorLog /proc/self/fd/2
    # Do not log OAuth/email tokens in query strings or referers.
    CustomLog /proc/self/fd/1 "%h %m %U %>s"
</VirtualHost>
