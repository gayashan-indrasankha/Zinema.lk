ServerName 127.0.0.1
TraceEnable Off
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot "/opt/zinema/Zinema.lk Website"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%m %U %>s %D"
    <Directory "/opt/zinema">
        Require all denied
        AllowOverride None
    </Directory>
    <Directory "/opt/zinema/Zinema.lk Website">
        Require all granted
        AllowOverride All
        Options -Indexes +FollowSymLinks
    </Directory>
    <Directory "/opt/zinema/Zinema.lk Website/includes">
        Require all denied
    </Directory>
    AliasMatch "^/__health/(live|dependencies|ready)$" "/opt/zinema/infra/runtime/health.php"
    <Directory "/opt/zinema/infra/runtime">
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>
</VirtualHost>
